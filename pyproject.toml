[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-watch"
version = "0.1.0"
description = "Helpers for a drone-video wildfire and smoke detection demo (YOLO26 via Roboflow)."
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.8", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
